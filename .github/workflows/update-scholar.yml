name: Update Google Scholar metrics

on:
  schedule:
    - cron: "17 2 * * 1"   # Every Monday 02:17 UTC (10:17 Beijing time)
  workflow_dispatch:        # Allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-scholar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch metrics from Google Scholar
        id: fetch
        # Exit code 2 = Scholar blocked us; data is kept and the job still succeeds.
        run: |
          set +e
          python scripts/update_scholar.py
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
          exit 0

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/scholar.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scholar.json
          git commit -m "chore: update Google Scholar metrics"
          git push
